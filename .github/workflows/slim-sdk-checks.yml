name: Validate OMP Slim RPC SDKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slim-sdk-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    name: Go and Python RPC contracts
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare validation logs
        run: mkdir -p dist/validation/sdk

      - name: Test Go SDK
        shell: bash
        working-directory: sdk/go/omp-rpc
        run: |
          go version
          go test ./... 2>&1 | tee ../../../dist/validation/sdk/go.log

      - name: Test Python SDK
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/omp-sdk-tests"
          "$RUNNER_TEMP/omp-sdk-tests/bin/python" -m pip install -e ./sdk/python/omp-rpc pytest
          "$RUNNER_TEMP/omp-sdk-tests/bin/python" -m pytest -q sdk/python/omp-rpc/tests 2>&1 | tee dist/validation/sdk/python.log

      - name: Upload SDK validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: omp-slim-sdk-checks-${{ github.sha }}
          retention-days: 7
          path: dist/validation/sdk/
