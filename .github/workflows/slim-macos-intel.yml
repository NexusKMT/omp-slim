name: Build OMP Slim for Intel Mac

on:
   workflow_dispatch:
      inputs:
         compare_wasm:
            description: Compare native-only and WASM-enabled builds with the same cache
            type: boolean
            default: false
         compare_optimization:
            description: Compare O3 ThinLTO, O3 without LTO, and workspace O2 without LTO
            type: boolean
            default: false
         compare_development:
            description: Measure real native edits with retained development build state
            type: boolean
            default: false
         development_profile:
            description: Development comparison profiles to run
            type: choice
            options: [both, dev, local]
            default: dev
         benchmark_scope:
            description: Quick uses one native edit; full runs all cases and three samples
            type: choice
            options: [quick, full]
            default: quick
         compiler_matrix:
            description: Profile compiler stages (full scope expands cases and frontend threads)
            type: boolean
            default: false
         benchmark_cache_key:
            description: Exact existing macOS build cache key for the comparison
            type: string
            default: ""

permissions:
   contents: read

concurrency:
   group: slim-macos-intel-${{ github.ref }}-${{ inputs.compiler_matrix && 'compiler-matrix' || inputs.compare_development && inputs.development_profile || 'build' }}
   cancel-in-progress: false

jobs:
   build:
      name: macOS 15 Intel build and smoke test
      if: ${{ github.event.repository.private == false && !inputs.compare_wasm && !inputs.compare_optimization && !inputs.compare_development && !inputs.compiler_matrix }}
      runs-on: macos-15-intel
      timeout-minutes: 120
      env:
         DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
         MACOSX_DEPLOYMENT_TARGET: "15.0"
         OMP_SLIM_BUILD_JOBS: "4"
         HOMEBREW_NO_AUTO_UPDATE: "1"
         OMP_TEST_CONCURRENCY: "2"
         OMP_TEST_TIMEOUT: "120"
      steps:
         - name: Check out requested revision
           uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
           with:
              persist-credentials: false

         - name: Verify Intel host and select Xcode SDK
           shell: bash
           run: |
              test "$(uname -m)" = x86_64
              test -d "$DEVELOPER_DIR"
              xcodebuild -version
              printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
              printf 'OMP_SLIM_CARGO_TARGET_DIR=%s/omp-slim-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf '%s\n' "$HOME/.bun/bin" "$HOME/.cargo/bin" >> "$GITHUB_PATH"

         - name: Restore dependency and Rust build caches
           id: build-cache
           uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
           with:
              path: |
                 ~/.bun/install/cache
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ runner.temp }}/omp-slim-cargo
              key: slim-macos15-intel-xcode16.4-ci-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', '.cargo/**', 'rust-toolchain.toml', 'bun.lock', 'scripts/slim/**', 'scripts/run-rs-task.ts', '.config/nextest.toml', 'packages/natives/scripts/**', '.github/workflows/slim-macos-intel.yml') }}
              restore-keys: |
                 slim-macos15-intel-xcode16.4-ci-v1-

         - name: Normalize source mtimes so a cache hit reuses path-crate fingerprints
           if: ${{ steps.build-cache.outputs.cache-hit == 'true' }}
           shell: bash
           run: |
              # actions/checkout stamps every file with the checkout time, which
              # cargo fingerprints as "modified after the last build" and rebuilds
              # all workspace and vendored path crates on every run. On a primary
              # cache hit the sources are byte-identical to the cached build, so
              # pinning mtimes into the past makes cargo treat them as Fresh; on a
              # miss the untouched checkout mtimes are newer than the restored
              # cache, so everything still rebuilds correctly.
              git ls-files -z | xargs -0 touch -t 202001010000.00

         - name: Install pinned toolchains and dependencies
           id: toolchains
           shell: bash
           run: |
              mkdir -p dist/validation/macos-intel
              bash scripts/slim/bootstrap.sh 2>&1 | tee dist/validation/macos-intel/bootstrap.log

         - name: Compile and verify native addon and standalone CLI
           id: native-build
           shell: bash
           run: bash scripts/slim/build.sh macos-intel

         - name: Install nextest for macOS PTY regressions
           uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
           with:
              tool: cargo-nextest@0.9.151

         - name: Test native PTY lifecycle on macOS
           shell: bash
           env:
              CARGO_TARGET_DIR: ${{ runner.temp }}/omp-slim-cargo
              CARGO_BUILD_JOBS: "4"
              RUSTFLAGS: "-C target-cpu=x86-64-v3"
              OMP_FORCE_RUST_TASKS: "1"
              NEXTEST_PROFILE: ci
              NEXTEST_TEST_THREADS: "4"
           run: |
              omp_pty_started=$SECONDS
              bun run test:rs:pty 2>&1 | tee dist/validation/macos-intel/pty-rust-tests.log
              printf '%s\n' "$((SECONDS - omp_pty_started))" > dist/validation/macos-intel/pty-seconds.txt
              bun test packages/natives/test/native.test.ts --test-name-pattern '\bpty\b' --timeout 40000 2>&1 | tee dist/validation/macos-intel/pty-bindings-tests.log

         - name: Preserve build cache even if validation fails
           if: ${{ !cancelled() && steps.toolchains.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' && steps.build-cache.outputs.cache-primary-key != '' }}
           continue-on-error: true
           uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
           with:
              path: |
                 ~/.bun/install/cache
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ runner.temp }}/omp-slim-cargo
              key: ${{ steps.build-cache.outputs.cache-primary-key }}

         - name: Check TypeScript workspace
           shell: bash
           run: bun run check:ts 2>&1 | tee dist/validation/macos-intel/check.log

         - name: Test retained TypeScript workspace behavior
           shell: bash
           env:
              # NSSpellServer times out on this hosted runner. Keep platform checks;
              # validate the real spelling service locally with the recovered addon.
              OMP_TEST_SKIP_MACOS_SPELLING: "1"
           run: bun run ci:test:ts 2>&1 | tee dist/validation/macos-intel/tests.log

         - name: Record artifact and source details
           if: always()
           shell: bash
           run: |
              {
                printf 'Source: `%s`\n\n' "$GITHUB_SHA"
                printf 'Runner: `macos-15-intel`; Xcode: `16.4`; deployment target: `15.0`.\n\n'
                printf 'Builds use ad-hoc signing for local testing.\n\n'
                printf 'One AppleSpell service integration test is skipped on this hosted runner because NSSpellServer times out. Platform capability checks still run; validate spelling locally with the recovered addon and OMP_TEST_SKIP_MACOS_SPELLING unset.\n\n'
                if [ -f dist/builds/latest ]; then
                  omp_run_dir="dist/builds/$(cat dist/builds/latest)"
                  if [ -f "$omp_run_dir/ARCHIVE-SHA256SUMS" ]; then
                    printf '```text\n'
                    cat "$omp_run_dir/ARCHIVE-SHA256SUMS"
                    printf '```\n'
                  fi
                fi
              } >> "$GITHUB_STEP_SUMMARY"

         - name: Upload binary archive, checksums and logs
           if: always()
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-darwin-x64-${{ github.sha }}
              retention-days: 7
              compression-level: 0
              if-no-files-found: warn
              path: |
                 dist/builds/**/*.tar.gz
                 dist/builds/**/SHA256SUMS
                 dist/builds/**/ARCHIVE-SHA256SUMS
                 dist/builds/**/build.log
                 dist/builds/**/exit-code
                 dist/builds/**/source-*
                 dist/builds/**/bun-version
                 dist/builds/**/rust-version
                 dist/builds/**/*-seconds
                 dist/builds/**/*.txt
                 dist/validation/macos-intel/*.log
                 dist/validation/macos-intel/*.txt

         - name: Preserve unverified compiled files after a failure
           if: ${{ failure() && steps.native-build.outcome == 'failure' }}
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-darwin-x64-unverified-${{ github.sha }}
              retention-days: 2
              compression-level: 0
              if-no-files-found: ignore
              path: |
                 packages/coding-agent/dist/omp
                 packages/natives/native/*.node
                 packages/natives/native/index.js
                 packages/natives/native/index.d.ts
                 dist/builds/**/source-*
                 dist/builds/**/exit-code

         - name: Upload native addon for local platform verification
           if: ${{ always() && steps.native-build.outcome == 'success' }}
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-native-addon-${{ github.sha }}
              retention-days: 7
              compression-level: 0
              if-no-files-found: error
              path: packages/natives/native/*.node

         - name: Upload generated native bindings for source comparison
           if: ${{ always() && (steps.native-build.outcome == 'success' || steps.native-build.outcome == 'failure') }}
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-native-bindings-${{ github.sha }}
              retention-days: 7
              path: |
                 packages/natives/native/index.js
                 packages/natives/native/index.d.ts

   native-benchmark:
      name: Native ${{ matrix.mode }} comparison
      if: ${{ github.event.repository.private == false && !inputs.compiler_matrix && !inputs.compare_development && (inputs.compare_wasm || inputs.compare_optimization) }}
      runs-on: macos-15-intel
      timeout-minutes: 120
      strategy:
         fail-fast: false
         matrix:
            include: ${{ fromJSON(inputs.compare_optimization && '[{"mode":"o3-thin","features":"","lto":"thin","opt":"3"},{"mode":"o3-no-lto","features":"","lto":"off","opt":"3"},{"mode":"o2-no-lto","features":"","lto":"off","opt":"2"}]' || '[{"mode":"wasm-disabled","features":"","lto":"thin","opt":"3"},{"mode":"wasm-enabled","features":"wasm-grammars","lto":"thin","opt":"3"}]') }}
      env:
         DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
         MACOSX_DEPLOYMENT_TARGET: "15.0"
         OMP_SLIM_BUILD_JOBS: "4"
         CARGO_BUILD_JOBS: "4"
         RUSTFLAGS: "-C target-cpu=x86-64-v3"
         HOMEBREW_NO_AUTO_UPDATE: "1"
         OMP_NATIVE_TIMINGS: "1"
         OMP_NATIVE_FEATURES: ${{ matrix.features }}
         CARGO_PROFILE_CI_LTO: ${{ matrix.lto }}
         CARGO_PROFILE_CI_OPT_LEVEL: ${{ matrix.opt }}
         OMP_NATIVE_BENCHMARK_MODE: ${{ matrix.mode }}
         OMP_NATIVE_BENCHMARK_CACHE_KEY: ${{ inputs.benchmark_cache_key }}
      steps:
         - name: Check out comparison source
           uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
           with:
              persist-credentials: false

         - name: Select matching host and build settings
           shell: bash
           run: |
              test "$(uname -m)" = x86_64
              test -n "$OMP_NATIVE_BENCHMARK_CACHE_KEY"
              test -d "$DEVELOPER_DIR"
              printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
              printf 'OMP_SLIM_CARGO_TARGET_DIR=%s/omp-slim-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf 'CARGO_TARGET_DIR=%s/omp-slim-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf '%s\n' "$HOME/.bun/bin" "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              mkdir -p dist/validation/native-benchmark
              sysctl machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu hw.memsize > dist/validation/native-benchmark/host.txt

         - name: Restore the exact same cache for all modes
           id: benchmark-cache
           uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
           with:
              path: |
                 ~/.bun/install/cache
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ runner.temp }}/omp-slim-cargo
              key: ${{ inputs.benchmark_cache_key }}
              fail-on-cache-miss: true

         - name: Install pinned toolchains and dependencies
           shell: bash
           run: bash scripts/slim/bootstrap.sh 2>&1 | tee dist/validation/native-benchmark/bootstrap.log

         - name: Verify the selected dependency graph
           shell: bash
           run: |
              omp_feature_args=()
              if [[ -n "$OMP_NATIVE_FEATURES" ]]; then omp_feature_args=(--features "$OMP_NATIVE_FEATURES"); fi
              cargo tree --locked -p pi-natives --target x86_64-apple-darwin --edges normal,build --prefix none --format '{p}' "${omp_feature_args[@]}" > dist/validation/native-benchmark/dependencies.txt
              python3 - <<'PY'
              import os
              from pathlib import Path
              packages = {line.split()[0] for line in Path('dist/validation/native-benchmark/dependencies.txt').read_text().splitlines()}
              engines = sorted(name for name in packages if name.startswith(('wasmtime', 'cranelift')))
              enabled = os.environ['OMP_NATIVE_FEATURES'] == 'wasm-grammars'
              assert bool(engines) == enabled, engines
              print(f'{len(packages)} dependency packages; WASM engine packages: {engines}')
              PY

         - name: Time native addon and CLI builds and run worker smoke
           shell: bash
           run: bash scripts/slim/build.sh "$OMP_NATIVE_BENCHMARK_MODE"

         - name: Time addon rebuild with dependencies already compiled
           if: ${{ inputs.compare_optimization }}
           shell: bash
           env:
              OMP_NATIVE_CARGO_PROFILE: ci
           run: |
              touch crates/pi-natives/src/pty.rs
              omp_rebuild_started=$SECONDS
              bun run build:native 2>&1 | tee dist/validation/native-benchmark/addon-rebuild.log
              printf '%s\n' "$((SECONDS - omp_rebuild_started))" > dist/validation/native-benchmark/addon-rebuild-seconds

         - name: Verify grammar behavior in the fresh addon
           shell: bash
           run: |
              bun -e 'import { wasmGrammarFor } from "@oh-my-pi/pi-natives"; const info = wasmGrammarFor({lang: "ini"}); if (info?.enabled !== (process.env.OMP_NATIVE_FEATURES === "wasm-grammars")) throw new Error("Wrong grammar build mode"); console.log(info);'
              bun test packages/natives/test/parse-status.test.ts packages/coding-agent/test/utils/grammars.test.ts 2>&1 | tee dist/validation/native-benchmark/grammar-tests.log

         - name: Install nextest for PTY comparison
           uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
           with:
              tool: cargo-nextest@0.9.151

         - name: Time PTY test compilation and execution
           shell: bash
           env:
              OMP_FORCE_RUST_TASKS: "1"
              NEXTEST_PROFILE: ci
              NEXTEST_TEST_THREADS: "4"
           run: |
              omp_pty_started=$SECONDS
              bun run test:rs:pty 2>&1 | tee dist/validation/native-benchmark/pty-tests.log
              printf '%s\n' "$((SECONDS - omp_pty_started))" > dist/validation/native-benchmark/pty-seconds
              bun test packages/natives/test/native.test.ts --test-name-pattern '\bpty\b' --timeout 40000 2>&1 | tee dist/validation/native-benchmark/pty-bindings-tests.log

         - name: Record comparison metrics
           if: always()
           shell: bash
           run: |
              python3 - <<'PY'
              import json, os
              from pathlib import Path
              root = Path('dist/validation/native-benchmark')
              root.mkdir(parents=True, exist_ok=True)
              data = dict(source=os.environ['GITHUB_SHA'], mode=os.environ['OMP_NATIVE_BENCHMARK_MODE'], cache_key=os.environ['OMP_NATIVE_BENCHMARK_CACHE_KEY'], lto=os.environ['CARGO_PROFILE_CI_LTO'], workspace_opt_level=os.environ['CARGO_PROFILE_CI_OPT_LEVEL'])
              latest = Path('dist/builds/latest')
              if latest.exists():
                  build = Path('dist/builds') / latest.read_text().strip()
                  for name in ['native-build-seconds', 'cli-build-seconds', 'exit-code']:
                      file = build / name
                      if file.exists(): data[name] = int(file.read_text())
              for name in ['pty-seconds', 'addon-rebuild-seconds']:
                  file = root / name
                  if file.exists(): data[name] = int(file.read_text())
              data['addons'] = {p.name: p.stat().st_size for p in Path('packages/natives/native').glob('pi_natives.darwin-x64*.node')}
              cli = Path('packages/coding-agent/dist/omp')
              if cli.exists(): data['cli-bytes'] = cli.stat().st_size
              text = json.dumps(data, indent=2) + '\n'
              (root / 'metrics.json').write_text(text)
              print(text)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary: summary.write('```json\n' + text + '```\n')
              PY

         - name: Upload comparison evidence and binaries
           if: always()
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-build-comparison-${{ matrix.mode }}-${{ github.sha }}
              retention-days: 7
              compression-level: 0
              path: |
                 dist/validation/native-benchmark/
                 dist/builds/**/*.tar.gz
                 dist/builds/**/ARCHIVE-SHA256SUMS
                 dist/builds/**/build.log
                 dist/builds/**/*-seconds
                 dist/builds/**/source-*
                 packages/natives/native/pi_natives.darwin-x64*.node
                 packages/natives/native/index.d.ts
                 packages/natives/native/index.js
                 ${{ runner.temp }}/omp-slim-cargo/cargo-timings/

   development-benchmark:
      name: Native edit feedback (${{ matrix.profile }})
      if: ${{ github.event.repository.private == false && !inputs.compiler_matrix && inputs.compare_development }}
      runs-on: macos-15-intel
      timeout-minutes: 180
      strategy:
         fail-fast: false
         matrix:
            profile: ${{ fromJSON(inputs.development_profile == 'dev' && '["dev"]' || inputs.development_profile == 'local' && '["local"]' || '["dev","local"]') }}
      env:
         DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
         MACOSX_DEPLOYMENT_TARGET: "15.0"
         HOMEBREW_NO_AUTO_UPDATE: "1"
         OMP_SLIM_BUILD_JOBS: "4"
         CARGO_BUILD_JOBS: "4"
         CARGO_BUILD_TARGET: x86_64-apple-darwin
         RUSTFLAGS: "-C target-cpu=x86-64-v3"
         OMP_NATIVE_CARGO_PROFILE: ${{ matrix.profile }}
         OMP_NATIVE_TIMINGS: "1"
         CARGO_INCREMENTAL: "1"
         OMP_BENCHMARK_SAMPLES: ${{ inputs.benchmark_scope == 'full' && '3' || '1' }}
      steps:
         - name: Check out benchmark source
           uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
           with:
              persist-credentials: false

         - name: Select matching host and record environment
           shell: bash
           run: |
              test "$(uname -m)" = x86_64
              test -d "$DEVELOPER_DIR"
              printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
              printf 'CARGO_TARGET_DIR=%s/omp-slim-development-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf 'PI_CODING_AGENT_DIR=%s/omp-slim-development-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf 'PI_CONFIG_DIR=%s/omp-slim-development-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf '%s\n' "$HOME/.bun/bin" "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              mkdir -p "dist/validation/development-benchmark/$OMP_NATIVE_CARGO_PROFILE"
              sysctl machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu hw.memsize > "dist/validation/development-benchmark/$OMP_NATIVE_CARGO_PROFILE/host.txt"
              xcodebuild -version >> "dist/validation/development-benchmark/$OMP_NATIVE_CARGO_PROFILE/host.txt"
              python3 scripts/slim/benchmark-development.py inspect

         - name: Restore build state for this development profile
           id: development-cache
           uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
           with:
              path: |
                 ~/.bun/install/cache
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ runner.temp }}/omp-slim-development-cargo
              key: slim-macos15-intel-xcode16.4-development-v2-inc1-${{ matrix.profile }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-${{ github.sha }}
              restore-keys: |
                 slim-macos15-intel-xcode16.4-development-v2-inc1-${{ matrix.profile }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-
                 slim-macos15-intel-xcode16.4-development-v1-${{ matrix.profile }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-

         - name: Install pinned toolchains and dependencies
           id: development-toolchains
           shell: bash
           run: |
              bash scripts/slim/bootstrap.sh 2>&1 | tee "dist/validation/development-benchmark/$OMP_NATIVE_CARGO_PROFILE/bootstrap.log"
              rustc -vV > "dist/validation/development-benchmark/$OMP_NATIVE_CARGO_PROFILE/rust-version.txt"
              bun --version > "dist/validation/development-benchmark/$OMP_NATIVE_CARGO_PROFILE/bun-version.txt"
              cargo build --locked -p pi-natives --profile "$OMP_NATIVE_CARGO_PROFILE" --target "$CARGO_BUILD_TARGET" --unit-graph -Z unstable-options > "dist/validation/development-benchmark/$OMP_NATIVE_CARGO_PROFILE/unit-graph.json"

         - name: Warm native build and verify original behavior
           id: warm
           shell: bash
           env:
              OMP_DEVELOPMENT_CACHE_KEY: ${{ steps.development-cache.outputs.cache-primary-key }}
              OMP_DEVELOPMENT_RESTORED_CACHE_KEY: ${{ steps.development-cache.outputs.cache-matched-key }}
           run: python3 scripts/slim/benchmark-development.py warm

         - name: Preserve build state even if addon installation fails
           if: ${{ !cancelled() && steps.development-toolchains.outcome == 'success' && steps.development-cache.outputs.cache-hit != 'true' }}
           continue-on-error: true
           uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
           with:
              path: |
                 ~/.bun/install/cache
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ runner.temp }}/omp-slim-development-cargo
              key: ${{ steps.development-cache.outputs.cache-primary-key }}

         - name: Measure native behavior changes and source worker smoke
           id: edits
           shell: bash
           run: python3 scripts/slim/benchmark-development.py edits

         - name: Restore addon and verify PTY shell grammar and workers
           id: restored
           if: ${{ !cancelled() && steps.warm.outcome == 'success' }}
           shell: bash
           run: python3 scripts/slim/benchmark-development.py restore

         - name: Summarize measured feedback times
           if: always()
           shell: bash
           run: python3 scripts/slim/benchmark-development.py summarize

         - name: Upload benchmark evidence
           if: always()
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-development-${{ matrix.profile }}-${{ github.sha }}
              retention-days: 7
              path: |
                 dist/validation/development-benchmark/${{ matrix.profile }}/
                 ${{ runner.temp }}/omp-slim-development-cargo/cargo-timings/

         - name: Upload verified restored native addon
           if: ${{ !cancelled() && steps.restored.outcome == 'success' }}
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-development-addon-${{ matrix.profile }}-${{ github.sha }}
              retention-days: 7
              compression-level: 0
              if-no-files-found: error
              path: |
                 packages/natives/native/pi_natives.darwin-x64*.node
                 packages/natives/native/index.js
                 packages/natives/native/index.d.ts
                 dist/validation/development-benchmark/${{ matrix.profile }}/validated-addon.json

   compiler-matrix:
      name: Compiler stages (frontend ${{ matrix.threads }})
      if: ${{ github.event.repository.private == false && inputs.compiler_matrix }}
      runs-on: macos-15-intel
      timeout-minutes: 180
      strategy:
         fail-fast: false
         max-parallel: 3
         matrix:
            threads: ${{ fromJSON(inputs.benchmark_scope == 'full' && '[1,2,4]' || '[1]') }}
      env:
         DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
         MACOSX_DEPLOYMENT_TARGET: "15.0"
         HOMEBREW_NO_AUTO_UPDATE: "1"
         OMP_SLIM_BUILD_JOBS: "4"
         CARGO_BUILD_JOBS: "4"
         CARGO_BUILD_TARGET: x86_64-apple-darwin
         RUSTFLAGS: "-C target-cpu=x86-64-v3"
         OMP_NATIVE_CARGO_PROFILE: dev
         OMP_NATIVE_TIMINGS: "1"
         OMP_FRONTEND_THREADS: ${{ matrix.threads }}
         CARGO_INCREMENTAL: "1"
         OMP_BENCHMARK_SAMPLES: ${{ inputs.benchmark_scope == 'full' && '3' || '1' }}
         OMP_BENCHMARK_SCOPE: ${{ inputs.benchmark_scope }}
      steps:
         - name: Check out compiler experiment
           uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
           with:
              persist-credentials: false

         - name: Select Intel host and isolated build paths
           shell: bash
           run: |
              test "$(uname -m)" = x86_64
              test -d "$DEVELOPER_DIR"
              printf 'SDKROOT=%s\n' "$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
              printf 'CARGO_TARGET_DIR=%s/omp-slim-development-cargo\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf 'PI_CODING_AGENT_DIR=%s/omp-slim-compiler-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf 'PI_CONFIG_DIR=%s/omp-slim-compiler-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
              printf '%s\n' "$HOME/.bun/bin" "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              mkdir -p "dist/validation/compiler-matrix/frontend-$OMP_FRONTEND_THREADS"
              sysctl machdep.cpu.brand_string hw.physicalcpu hw.logicalcpu hw.memsize > "dist/validation/compiler-matrix/frontend-$OMP_FRONTEND_THREADS/host.txt"
              xcodebuild -version >> "dist/validation/compiler-matrix/frontend-$OMP_FRONTEND_THREADS/host.txt"

         - name: Restore matching checkpoint or existing dev dependencies
           id: compiler-cache
           uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
           with:
              path: |
                 ~/.bun/install/cache
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ runner.temp }}/omp-slim-development-cargo
              key: slim-macos15-intel-xcode16.4-compiler-v2-inc1-front${{ matrix.threads }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-${{ github.sha }}
              restore-keys: |
                 slim-macos15-intel-xcode16.4-compiler-v2-inc1-front${{ matrix.threads }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-
                 slim-macos15-intel-xcode16.4-compiler-v1-front${{ matrix.threads }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-
                 slim-macos15-intel-xcode16.4-development-v2-inc1-dev-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-
                 slim-macos15-intel-xcode16.4-development-v1-dev-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**', 'rust-toolchain.toml') }}-

         - name: Install toolchains and record exact versions
           id: compiler-toolchains
           shell: bash
           run: |
              bash scripts/slim/bootstrap.sh 2>&1 | tee "dist/validation/compiler-matrix/frontend-$OMP_FRONTEND_THREADS/bootstrap.log"
              rustc -vV > "dist/validation/compiler-matrix/frontend-$OMP_FRONTEND_THREADS/rust-version.txt"
              bun --version > "dist/validation/compiler-matrix/frontend-$OMP_FRONTEND_THREADS/bun-version.txt"

         - name: Establish and validate compilation checkpoint
           id: compiler-warm
           shell: bash
           env:
              OMP_DEVELOPMENT_CACHE_KEY: ${{ steps.compiler-cache.outputs.cache-primary-key }}
              OMP_DEVELOPMENT_RESTORED_CACHE_KEY: ${{ steps.compiler-cache.outputs.cache-matched-key }}
           run: python3 scripts/slim/benchmark-compiler.py warm

         - name: Save checkpoint before differential edits
           if: ${{ !cancelled() && steps.compiler-toolchains.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
           continue-on-error: true
           uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
           with:
              path: |
                 ~/.bun/install/cache
                 ~/.cargo/registry
                 ~/.cargo/git
                 ${{ runner.temp }}/omp-slim-development-cargo
              key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

         - name: Measure native builtins and shell edits with stage diagnostics
           if: ${{ !cancelled() && steps.compiler-warm.outcome == 'success' }}
           shell: bash
           run: python3 scripts/slim/benchmark-compiler.py samples

         - name: Summarize compiler matrix evidence
           if: always()
           shell: bash
           run: python3 scripts/slim/benchmark-compiler.py summarize

         - name: Upload diagnostic logs and timings
           if: always()
           uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
           with:
              name: omp-slim-compiler-front${{ matrix.threads }}-${{ github.sha }}
              retention-days: 7
              path: |
                 dist/validation/compiler-matrix/frontend-${{ matrix.threads }}/
                 ${{ runner.temp }}/omp-slim-development-cargo/cargo-timings/
