[package]
name = "pi-natives"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []
# Optional extra language grammars; OMP Slim uses only linked grammars by default.
wasm-grammars = ["pi-ast/wasm"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
arboard.workspace = true
base64.workspace = true
fontdue.workspace = true
grep-matcher.workspace = true
futures.workspace = true
html-escape.workspace = true
html-to-markdown-rs.workspace = true
image = { workspace = true, features = ["bmp"] }
resvg.workspace = true
# Feature activation only (see workspace manifest): zune-jpeg needs `log` to compile.
zune-jpeg.workspace = true
# Upstream pinning only (see workspace manifest): tinyvec 1.13.0 is broken upstream.
tinyvec.workspace = true
napi.workspace = true
napi-derive.workspace = true
# Already in the graph via pi-builtins; wakes the OAuth callback wait.
notify = "=8.2.0"
log = "0.4"
# Already in the graph via pi-builtins; SIMD newline search for IPC line framing.
memchr = "2.7.4"
pi-vcs.workspace = true
parking_lot.workspace = true
pdf-inspector.workspace = true
phf.workspace = true
flume.workspace = true
pi-ast.workspace = true
pi-builtins.workspace = true
pi-diff.workspace = true
pi-edit.workspace = true
pi-walker.workspace = true
pi-iso.workspace = true
pi-predict.workspace = true
pi-shell.workspace = true
pi-vfs.workspace = true
portable-pty.workspace = true
png.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
syntect.workspace = true
tokio.workspace = true
tokio-util.workspace = true
xutf.workspace = true
zstd.workspace = true
xxhash-rust.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
napi-build.workspace = true
shlex.workspace = true
syntect.workspace = true
# Match runtime features for dependencies shared with build scripts and proc macros.
bitflags = { version = "2", features = ["std"] }
crc32fast = "1"
data-encoding = "2"
either = "1"
fastrand = { version = "2", features = ["js"] }
flate2 = { version = "1", features = ["zlib-rs"] }
foldhash = "0.2"
hashbrown = "0.17"
indexmap = { version = "2", features = ["serde"] }
libc = { version = "0.2", features = ["extra_traits"] }
peg-runtime = { version = "0.8", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }
serde = { workspace = true, features = ["rc", "alloc"] }
serde_core = { version = "1", features = ["rc", "alloc"] }
serde_json = { workspace = true, features = ["raw_value", "alloc"] }
simd-adler32 = "0.3"
zlib-rs = "0.6"

[dev-dependencies]
fancy-regex.workspace = true # utok scanner differential oracle
shlex.workspace = true
tiktoken-rs.workspace = true # utok openai differential oracle
xkeysym = "=0.2.1"
